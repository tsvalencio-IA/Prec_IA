<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Responder Cotação - valor_IA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--line:#d9e2ef;--text:#172033;--blue:#2563eb;--green:#15803d;--red:#dc2626;--muted:#64748b}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px}main{max-width:640px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,.05)}h1{font-size:22px;margin:0 0 5px}h3{margin:0 0 10px;color:var(--blue)}label{display:block;font-weight:bold;margin:12px 0 6px;font-size:13px;color:#46556b}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}button{border:none;padding:14px;border-radius:10px;font-weight:bold;cursor:pointer;color:white;width:100%;margin-bottom:10px}.btn-green{background:var(--green)}.btn-blue{background:var(--blue)}.btn-red{background:var(--red)}.btn-light{background:#eef4fb;color:var(--blue);border:1px solid var(--blue)}.pill{display:inline-block;background:#f1f5f9;border:1px solid var(--line);padding:5px 10px;border-radius:99px;font-size:12px;margin-right:5px;margin-bottom:10px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}th,td{border:1px solid var(--line);padding:8px;text-align:left}th{background:#f8fafc}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}@media print{.no-print{display:none!important}body{background:white}.card{box-shadow:none;border:none}}
</style>
</head>
<body>
<main>
<div class="card no-print" id="headerCard"><h1 id="title">Carregando...</h1><p id="subtitle" class="muted"></p></div>
<div id="formArea" class="hidden no-print">
  <div style="text-align:right;font-weight:bold;color:var(--muted);margin-bottom:10px" id="progressText"></div>
  <div class="card">
    <h3 id="itemDesc"></h3>
    <div id="itemPills"></div>
    <p id="itemObs" style="font-size:13px;color:#b45309;background:#fffbeb;padding:8px;border-radius:8px" class="hidden"></p>
    <label>Disponibilidade</label><select id="inputDisp" onchange="toggleCampos()"><option value="sim">Tenho (informar preço)</option><option value="nao">Não tenho</option></select>
    <div id="camposPrecificacao" style="margin-top:15px">
      <label>Marca</label><input id="inputMarca">
      <label>Código da marca</label><input id="inputCodMarca">
      <label>Descrição do fornecedor</label><input id="inputSuaDesc">
      <label>Preço unitário (R$)</label><input type="number" id="inputPreco" step="0.01">
      <label>Disponibilidade / prazo</label><input id="inputPrazo">
      <label>Observação</label><textarea id="inputObs" rows="2"></textarea>
    </div>
    <button class="btn-blue" id="btnProximo" onclick="salvarItemAtual(false)">Salvar e ir para próxima</button>
    <button class="btn-green hidden" id="btnFinalizar" onclick="salvarItemAtual(true)">Salvar último item e finalizar</button>
  </div>
</div>
<div id="doneArea" class="card hidden">
  <h2 style="color:var(--green);text-align:center">✓ Comprovante de Cotação</h2>
  <p><b>Cotação:</b> <span id="recQuote"></span></p>
  <p><b>Data/Hora:</b> <span id="recDate"></span></p>
  <p><b>Protocolo:</b> <span id="recProtocol"></span></p>
  <div id="resumoTabela"></div>
  <button class="btn-light no-print" onclick="window.print()">Imprimir / Salvar PDF</button>
</div>
<p class="footer no-print">Powered by thIAguinho Soluções Digitais</p>
</main>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);
const db=firebase.database();
const params=new URLSearchParams(location.search);
const source=params.get('source')||'quotes';
const quoteId=params.get('q');
const supplierId=params.get('s');
let quoteData=null,itemsList=[],currentIndex=0,resumoSalvo=[];
if(!quoteId||!supplierId){title.innerText='Link inválido'}else carregarCotacao();
function carregarCotacao(){db.ref((source==='cotacoes'?'cotacoes/':'quotes/')+quoteId).once('value',snap=>{quoteData=snap.val();if(!quoteData){title.innerText='Cotação não encontrada';return}const st=String(quoteData.status||'').toLowerCase();if(['fechada','encerrada','cancelada','closed'].some(s=>st.includes(s))){title.innerText='Cotação encerrada';subtitle.innerText='O prazo desta cotação expirou.';return}title.innerText='Cotação '+(quoteData.number||quoteData.numero||quoteId);const v=quoteData.vehicle||quoteData.veiculo||{};subtitle.innerText=[v.marca||v.brand,v.modelo||v.model,v.placa||v.plate].filter(Boolean).join(' ')||'Cotação geral';itemsList=Array.isArray(quoteData.items)?quoteData.items:Object.values(quoteData.pecas||{}).sort((a,b)=>(a.ordem||0)-(b.ordem||0));if(itemsList.length){formArea.classList.remove('hidden');renderizarItemAtual()}else subtitle.innerText='Cotação sem itens.'})}
function renderizarItemAtual(){const item=itemsList[currentIndex];progressText.innerText=`Item ${currentIndex+1} de ${itemsList.length}`;itemDesc.innerText=item.desc||item.descricaoOriginal||'Item sem descrição';itemPills.innerHTML=`<span class="pill">Código: ${item.oem||item.codigoOriginal||'-'}</span><span class="pill">Qtd: <b>${item.qty||item.quantidade||1}</b></span>`;if(item.obs){itemObs.innerText='Obs oficina: '+item.obs;itemObs.classList.remove('hidden')}else itemObs.classList.add('hidden');inputDisp.value='sim';['inputMarca','inputCodMarca','inputSuaDesc','inputPreco','inputPrazo','inputObs'].forEach(id=>document.getElementById(id).value='');toggleCampos();btnProximo.classList.toggle('hidden',currentIndex===itemsList.length-1);btnFinalizar.classList.toggle('hidden',currentIndex!==itemsList.length-1)}
function toggleCampos(){camposPrecificacao.style.display=inputDisp.value==='sim'?'block':'none'}
function salvarItemAtual(finalizar){const item=itemsList[currentIndex],itemId=item.id||`p${currentIndex}`,tem=inputDisp.value==='sim',preco=parseFloat(inputPreco.value);if(tem&&(isNaN(preco)||preco<=0)){alert('Informe um preço válido.');return}const payload={available:tem,temDisponivel:tem,brand:tem?inputMarca.value:'',brandCode:tem?inputCodMarca.value:'',desc:tem?inputSuaDesc.value:'',price:tem?preco:0,availability:tem?inputPrazo.value:'indisponível',obs:tem?inputObs.value:'Não tenho',source:'formulário',updatedAt:Date.now(),fornecedorNome:supplierId,signature:'Powered by thIAguinho Soluções Digitais'};const path=source==='quotes'?`quotes/${quoteId}/responses/${supplierId}/${itemId}`:`respostas/${quoteId}/${supplierId}/${itemId}`;const btn=finalizar?btnFinalizar:btnProximo;const old=btn.innerText;btn.innerText='Salvando...';btn.disabled=true;db.ref(path).set(payload).then(()=>{btn.disabled=false;btn.innerText=old;resumoSalvo.push({desc:item.desc||item.descricaoOriginal,tem,preco,marca:payload.brand});if(finalizar)mostrarResumo();else{currentIndex++;renderizarItemAtual();scrollTo(0,0)}}).catch(e=>{alert('Erro ao salvar: '+e.message);btn.disabled=false;btn.innerText=old})}
function mostrarResumo(){headerCard.classList.add('hidden');formArea.classList.add('hidden');doneArea.classList.remove('hidden');recQuote.innerText=quoteData.number||quoteData.numero||quoteId;recDate.innerText=new Date().toLocaleString('pt-BR');recProtocol.innerText='VAL-'+Date.now().toString().slice(-6);let html='<table><thead><tr><th>Peça</th><th>Status</th><th>Marca</th><th>Preço</th></tr></thead><tbody>';resumoSalvo.forEach(r=>html+=`<tr><td>${r.desc}</td><td style="color:${r.tem?'green':'red'}">${r.tem?'Tenho':'Não tenho'}</td><td>${r.marca||'-'}</td><td>${r.tem?'R$ '+r.preco.toFixed(2):'-'}</td></tr>`);resumoTabela.innerHTML=html+'</tbody></table>'}
</script>
</body>
</html>
