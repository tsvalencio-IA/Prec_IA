<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Responder cotação — valor_IA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #f0f4f8; --card: #fff; --line: #e2e8f0;
  --ink: #0f172a; --muted: #64748b;
  --blue: #1d4ed8; --green: #16a34a; --red: #dc2626; --amber: #d97706;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(15,23,42,.07);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); font-family: Arial, Helvetica, sans-serif; color: var(--ink); padding-bottom: 40px; }
header { background: linear-gradient(135deg, #fff, #eef5ff); border-bottom: 1px solid var(--line); padding: 14px 16px; }
.hdr { max-width: 880px; margin: auto; display: flex; gap: 10px; align-items: center; }
.logo { font-size: 26px; background: white; border: 1px solid var(--line); border-radius: 14px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); flex-shrink: 0; }
.hdr-title { font-size: 18px; font-weight: 900; margin: 0; }
.hdr-sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
main { max-width: 880px; margin: auto; padding: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
label { display: block; font-size: 12px; font-weight: 800; color: #46556b; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .3px; }
input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 14px; background: white; color: var(--ink); outline: none; }
input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,78,216,.08); }
textarea { min-height: 70px; resize: vertical; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
button { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 800; font-size: 14px; cursor: pointer; margin: 3px; transition: opacity .15s; }
button:active { opacity: .8; }
.btn-blue { background: var(--blue); color: white; }
.btn-green { background: var(--green); color: white; }
.btn-red { background: var(--red); color: white; }
.btn-ghost { background: #f1f5f9; color: #334155; border: 1px solid var(--line); }
.pill { display: inline-flex; align-items: center; background: #f8fafc; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 12px; margin: 2px; font-weight: 600; }
.pill-blue { background: #eff6ff; border-color: #bfdbfe; color: #1e3a8a; }
.pill-green { background: #f0fdf4; border-color: #bbf7d0; color: var(--green); }
.pill-amber { background: #fffbeb; border-color: #fde68a; color: var(--amber); }
.ok { color: var(--green); font-weight: 800; }
.bad { color: var(--red); font-weight: 800; }
.warn { color: var(--amber); font-weight: 800; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Progress */
.prog-wrap { background: #e2e8f0; border-radius: 999px; height: 8px; margin: 10px 0; }
.prog-fill { height: 100%; border-radius: 999px; background: var(--blue); transition: width .4s; }
.prog-fill.done { background: var(--green); }

/* Item card */
.item-card { border: 1px solid var(--line); border-radius: 14px; background: white; overflow: hidden; margin-bottom: 14px; }
.item-head { background: linear-gradient(90deg, #eff6ff, #f8fafc); border-bottom: 1px solid var(--line); padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.item-num { width: 32px; height: 32px; background: var(--blue); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; flex-shrink: 0; }
.item-body { padding: 14px; }
.item-answered { border-color: #bbf7d0; }
.item-answered .item-head { background: linear-gradient(90deg, #f0fdf4, #f8fafc); }
.item-nothas { border-color: #fecaca; }
.item-nothas .item-head { background: linear-gradient(90deg, #fff1f2, #f8fafc); }

/* Availability toggle */
.avail-row { display: flex; gap: 10px; margin: 12px 0 8px; }
.avail-btn { flex: 1; padding: 13px; border-radius: 12px; border: 2px solid var(--line); background: white; cursor: pointer; font-weight: 900; font-size: 15px; text-align: center; transition: all .15s; }
.avail-btn.selected-yes { border-color: var(--green); background: #f0fdf4; color: var(--green); }
.avail-btn.selected-no { border-color: var(--red); background: #fff1f2; color: var(--red); }

/* Response fields */
.resp-fields { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; }

/* Closed / Success screens */
.full-screen { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
.big-icon { font-size: 64px; margin-bottom: 16px; }

footer { text-align: center; color: var(--muted); padding: 20px; font-size: 13px; border-top: 1px solid var(--line); margin-top: 8px; }

@media (max-width: 600px) {
  main { padding: 10px; }
  .grid { grid-template-columns: 1fr; }
  .avail-btn { font-size: 14px; padding: 11px; }
}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo" id="hdrLogo">🧾</div>
    <div>
      <div class="hdr-title" id="hdrTitle">valor_IA — Cotação</div>
      <div class="hdr-sub" id="hdrSub">Carregando...</div>
    </div>
  </div>
</header>

<main id="main">
  <div class="full-screen">
    <div class="big-icon">⏳</div>
    <p class="muted">Carregando cotação...</p>
  </div>
</main>

<footer>Powered by thIAguinho Soluções Digitais</footer>

<script>
const ASSINATURA = 'Powered by thIAguinho Soluções Digitais';

let db, qid, sid, tokenParam, quote = {}, supplier = {}, settings = {};
let responses = {}; // itemId -> saved response object
let saving = {};    // itemId -> bool (debounce flag)

function qs(k) { return new URLSearchParams(location.search).get(k) || ''; }
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function parseMoney(v) {
  let s = String(v ?? '').replace(/[^\d,.-]/g, '').trim();
  if (!s) return 0;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}
function money(v) { return Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function items() { return quote.items || []; }
function $ (id) { return document.getElementById(id); }

function showMain(html) { document.getElementById('main').innerHTML = html; }

/* =============================================
   INIT
   ============================================= */
function init() {
  qid = qs('q');
  sid = qs('s');
  tokenParam = qs('t');

  if (!qid || !sid) {
    return showMain(`<div class="full-screen"><div class="big-icon">⚠️</div><h2>Link inválido</h2><p class="muted">Este link está incompleto. Solicite um novo link ao estabelecimento.</p><p class="small muted">${ASSINATURA}</p></div>`);
  }
  if (!window.firebaseConfig) {
    return showMain(`<div class="full-screen"><div class="big-icon">⚙️</div><h2>Erro de configuração</h2><p class="muted">firebase-config.js não carregou.</p></div>`);
  }

  firebase.initializeApp(window.firebaseConfig);
  db = firebase.database();

  // Load settings for establishment name
  db.ref('settings/main').once('value').then(s => {
    settings = s.val() || {};
    if (settings.name) {
      document.getElementById('hdrTitle').textContent = settings.name + ' — Cotação';
    }
  });

  // Load quote and supplier
  db.ref('quotes/' + qid).on('value', snap => {
    quote = snap.val() || {};
    db.ref('suppliers/' + sid).once('value').then(x => {
      supplier = x.val() || {};
      // Load saved responses for this supplier
      const saved = (quote.responses && quote.responses[sid]) || {};
      // Only pre-fill if we haven't started filling manually
      if (Object.keys(responses).length === 0) {
        responses = {};
        Object.entries(saved).forEach(([itemId, r]) => {
          responses[itemId] = r;
        });
      }
      renderApp();
    });
  });
}

/* =============================================
   RENDER APP
   ============================================= */
function renderApp() {
  if (!quote.id) {
    return showMain(`<div class="full-screen"><div class="big-icon">🔍</div><h2>Cotação não encontrada</h2><p class="muted">Esta cotação foi excluída ou não existe.</p></div>`);
  }

  // Token validation (permissive — only block if both exist and don't match)
  const savedLink = quote.links && quote.links[sid];
  if (savedLink && savedLink.token && tokenParam && savedLink.token !== tokenParam) {
    return showMain(`<div class="full-screen"><div class="big-icon">🚫</div><h2>Link não autorizado</h2><p class="muted">Este link foi invalidado. Solicite um novo link ao estabelecimento.</p></div>`);
  }

  if (quote.status === 'closed') {
    return showMain(`<div class="full-screen"><div class="big-icon">🔒</div><h2>Cotação encerrada</h2><p class="muted">Esta cotação foi encerrada e não aceita mais respostas.</p><p class="small muted">${ASSINATURA}</p></div>`);
  }

  const allItems = items();
  const answeredCount = allItems.filter(it => responses[it.id] !== undefined).length;
  const pct = allItems.length ? Math.round(answeredCount / allItems.length * 100) : 0;

  // Update header
  const supName = supplier.name || 'Fornecedor';
  document.getElementById('hdrSub').textContent = supName + ' · ' + allItems.length + ' item(ns)';

  const veh = [quote.vehicle?.brand, quote.vehicle?.model, quote.vehicle?.plate].filter(Boolean).join(' ');

  let html = '';

  // Quote info card
  html += `<div class="card">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div>
        <b style="font-size:16px">Cotação ${esc(quote.number || qid)}</b>
        <div class="muted small">${esc(veh) || 'Sem veículo especificado'}</div>
      </div>
      <span class="pill pill-blue">👤 ${esc(supName)}</span>
    </div>
    <div style="margin-top:12px">
      <div class="row" style="justify-content:space-between">
        <span style="font-size:13px;font-weight:800">${answeredCount} de ${allItems.length} item(ns) respondidos (${pct}%)</span>
        <span class="small muted">${pct === 100 ? '✅ Completo' : 'Em andamento'}</span>
      </div>
      <div class="prog-wrap"><div class="prog-fill ${pct === 100 ? 'done' : ''}" style="width:${pct}%"></div></div>
    </div>
  </div>`;

  // Items
  allItems.forEach((it, idx) => {
    const r = responses[it.id];
    const isAnswered = r !== undefined;
    const isYes = r && r.available !== false;
    const isNo = r && r.available === false;
    const cardClass = isYes ? 'item-answered' : isNo ? 'item-nothas' : '';

    html += `<div class="item-card ${cardClass}" id="card_${esc(it.id)}">
      <div class="item-head">
        <div class="item-num">${idx + 1}</div>
        <div style="flex:1">
          <b>${esc(it.desc)}</b>
          <div class="row" style="margin-top:4px">
            ${it.oem && it.oem !== 'sem oem' ? `<span class="pill">Cód: ${esc(it.oem)}</span>` : ''}
            <span class="pill">Qtd: ${esc(it.qty || 1)}</span>
            ${it.altCode ? `<span class="pill">Alt: ${esc(it.altCode)}</span>` : ''}
          </div>
        </div>
        ${isAnswered ? `<span class="pill ${isYes ? 'pill-green' : 'pill-red'}">${isYes ? '✅ Tem' : '❌ Não tem'}</span>` : ''}
      </div>
      <div class="item-body">
        <div class="avail-row">
          <div class="avail-btn ${isYes ? 'selected-yes' : ''}" onclick="setAvail('${esc(it.id)}', true)">✅ Tenho</div>
          <div class="avail-btn ${isNo ? 'selected-no' : ''}" onclick="setAvail('${esc(it.id)}', false)">❌ Não tenho</div>
        </div>

        <div id="fields_${esc(it.id)}" style="display:${isYes ? 'block' : 'none'}">
          <div class="resp-fields">
            <div class="grid">
              <div>
                <label>Marca</label>
                <input id="brand_${esc(it.id)}" value="${esc(r?.brand || '')}" placeholder="Ex: Bosch, Fremax, TRW..." oninput="markDirty('${esc(it.id)}')">
              </div>
              <div>
                <label>Código da marca</label>
                <input id="bc_${esc(it.id)}" value="${esc(r?.brandCode || '')}" placeholder="Cód. do fabricante" oninput="markDirty('${esc(it.id)}')">
              </div>
            </div>
            <div class="grid">
              <div>
                <label>Preço unitário (R$) *</label>
                <input id="price_${esc(it.id)}" value="${esc(r?.price ? String(r.price).replace('.', ',') : '')}" placeholder="0,00" type="text" inputmode="decimal" oninput="markDirty('${esc(it.id)}')">
              </div>
              <div>
                <label>Prazo de entrega</label>
                <input id="disp_${esc(it.id)}" value="${esc(r?.availability || '')}" placeholder="Ex: Pronto, 2h, amanhã..." oninput="markDirty('${esc(it.id)}')">
              </div>
            </div>
            <label>Descrição (como vocês chamam este item)</label>
            <input id="desc_${esc(it.id)}" value="${esc(r?.desc || '')}" placeholder="Opcional" oninput="markDirty('${esc(it.id)}')">
            <label>Observação</label>
            <textarea id="obs_${esc(it.id)}" placeholder="Qualquer informação adicional" oninput="markDirty('${esc(it.id)}')">${esc(r?.obs || '')}</textarea>
          </div>
          <button class="btn-green" onclick="saveItem('${esc(it.id)}')">💾 Salvar este item</button>
          <span id="st_${esc(it.id)}" class="muted small" style="margin-left:6px"></span>
        </div>

        <div id="nothas_${esc(it.id)}" style="display:${isNo ? 'block' : 'none'}">
          <div class="resp-fields" style="background:#fff1f2;border-color:#fecaca">
            <label>Observação (motivo, substituto, prazo futuro)</label>
            <textarea id="nothasObs_${esc(it.id)}" placeholder="Opcional: por que não tem, quando terá, produto substituto..." oninput="markDirty('${esc(it.id)}')">${esc(r?.obs || '')}</textarea>
          </div>
          <button class="btn-ghost" onclick="saveItem('${esc(it.id)}')">💾 Confirmar "não tenho"</button>
          <span id="st_${esc(it.id)}" class="muted small" style="margin-left:6px"></span>
        </div>
      </div>
    </div>`;
  });

  // Save all button
  html += `<div class="card" style="text-align:center">
    <p class="muted" style="margin-bottom:12px">Revise todos os itens e confirme.</p>
    <button class="btn-green" style="font-size:16px;padding:14px 28px" onclick="saveAll()">✅ Salvar tudo e confirmar</button>
    <p class="small muted" style="margin-top:10px">${ASSINATURA}</p>
  </div>`;

  showMain(html);
}

/* =============================================
   INTERACTION
   ============================================= */
function setAvail(itemId, val) {
  // Update UI immediately
  const fieldsDiv = document.getElementById('fields_' + itemId);
  const nothasDiv = document.getElementById('nothas_' + itemId);
  if (fieldsDiv) fieldsDiv.style.display = val ? 'block' : 'none';
  if (nothasDiv) nothasDiv.style.display = val ? 'none' : 'block';

  // Update avail buttons
  const card = document.getElementById('card_' + itemId);
  if (card) {
    card.querySelectorAll('.avail-btn').forEach(b => {
      b.classList.remove('selected-yes', 'selected-no');
    });
    const btns = card.querySelectorAll('.avail-btn');
    if (btns[0]) btns[0].classList.add(val ? 'selected-yes' : '');
    if (btns[1]) btns[1].classList.add(val ? '' : 'selected-no');
  }

  // Mark in responses (will be saved on saveItem or saveAll)
  if (!responses[itemId]) responses[itemId] = {};
  responses[itemId].available = val;

  if (!val) {
    // Auto-clear price for "não tenho"
    const priceEl = document.getElementById('price_' + itemId);
    if (priceEl) priceEl.value = '';
  }
}

function markDirty(itemId) {
  const st = document.getElementById('st_' + itemId);
  if (st) st.textContent = '';
}

function payload(itemId) {
  const r = responses[itemId] || {};
  const available = r.available !== undefined ? r.available : (document.getElementById('fields_' + itemId)?.style.display !== 'none');
  const obs = available
    ? (document.getElementById('obs_' + itemId)?.value.trim() || '')
    : (document.getElementById('nothasObs_' + itemId)?.value.trim() || '');
  return {
    available,
    brand: document.getElementById('brand_' + itemId)?.value.trim() || '',
    brandCode: document.getElementById('bc_' + itemId)?.value.trim() || '',
    price: parseMoney(document.getElementById('price_' + itemId)?.value || ''),
    availability: document.getElementById('disp_' + itemId)?.value.trim() || '',
    desc: document.getElementById('desc_' + itemId)?.value.trim() || '',
    obs,
    updatedAt: Date.now(),
    signature: ASSINATURA
  };
}

function saveItem(itemId) {
  const p = payload(itemId);
  responses[itemId] = p;

  return db.ref(`quotes/${qid}/responses/${sid}/${itemId}`).set(p).then(() => {
    const st = document.getElementById('st_' + itemId);
    if (st) { st.textContent = '✅ salvo'; st.className = 'ok small'; }

    // Update card visual state
    const card = document.getElementById('card_' + itemId);
    if (card) {
      card.className = 'item-card ' + (p.available ? 'item-answered' : 'item-nothas');
    }

    // Auto-update priceDb for available items with price
    if (p.available && p.price > 0) {
      const it = items().find(x => x.id === itemId);
      if (it) {
        const priceId = `auto_${sid}_${(it.oem || itemId).replace(/[^a-z0-9]/gi, '_')}`;
        db.ref('priceDb/' + priceId).update({
          supplierId: sid,
          oem: it.oem || '',
          desc: p.desc || it.desc,
          brand: p.brand,
          brandCode: p.brandCode,
          price: p.price,
          availability: p.availability,
          obs: p.obs,
          updatedAt: Date.now(),
          signature: ASSINATURA
        });
      }
    }

    // Update progress bar
    updateProgress();
  }).catch(err => {
    const st = document.getElementById('st_' + itemId);
    if (st) { st.textContent = '⚠️ erro: ' + err.message; st.className = 'bad small'; }
  });
}

function updateProgress() {
  const allItems = items();
  const answered = allItems.filter(it => responses[it.id] !== undefined).length;
  const pct = allItems.length ? Math.round(answered / allItems.length * 100) : 0;

  const fill = document.querySelector('.prog-fill');
  if (fill) { fill.style.width = pct + '%'; fill.className = 'prog-fill' + (pct === 100 ? ' done' : ''); }

  const progLabel = document.querySelector('.prog-wrap')?.previousElementSibling;
  if (progLabel) progLabel.textContent = answered + ' de ' + allItems.length + ' item(ns) respondidos (' + pct + '%)';
}

function saveAll() {
  const allItems = items();
  if (!allItems.length) return;

  const unanswered = allItems.filter(it => responses[it.id] === undefined);
  if (unanswered.length > 0) {
    const names = unanswered.slice(0, 3).map(it => it.desc).join(', ');
    const more = unanswered.length > 3 ? ` e mais ${unanswered.length - 3}` : '';
    if (!confirm(`${unanswered.length} item(ns) ainda sem resposta:\n${names}${more}\n\nDeseja enviar assim mesmo?`)) return;
  }

  const btn = document.querySelector('button.btn-green[onclick="saveAll()"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Salvando...'; }

  // Save all items that have a response
  const promises = allItems
    .filter(it => responses[it.id] !== undefined)
    .map(it => saveItem(it.id));

  Promise.all(promises).then(() => {
    showMain(`<div class="full-screen">
      <div class="big-icon">🎉</div>
      <h2 style="color:var(--green)">Cotação enviada com sucesso!</h2>
      <p class="muted">Obrigado, <b>${esc(supplier.name || 'Fornecedor')}</b>!</p>
      <p class="muted">Sua resposta foi registrada e o estabelecimento já pode visualizá-la.</p>
      <p style="margin-top:20px">
        <span class="pill" style="font-size:14px;padding:8px 16px">✅ ${allItems.filter(it => responses[it.id]?.available).length} item(ns) disponíveis</span>
        <span class="pill" style="font-size:14px;padding:8px 16px">❌ ${allItems.filter(it => responses[it.id]?.available === false).length} indisponíveis</span>
      </p>
      <p class="small muted" style="margin-top:24px">${ASSINATURA}</p>
    </div>`);
  }).catch(err => {
    if (btn) { btn.disabled = false; btn.textContent = '✅ Salvar tudo e confirmar'; }
    alert('Erro ao salvar: ' + err.message);
  });
}

window.addEventListener('load', init);
</script>
</body>
</html>
